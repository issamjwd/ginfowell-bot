# Run ONCE by hand (SETUP.md step 10): pins EB Garamond in assets/fonts/fonts.lock.json to one google/fonts commit
# plus each file's sha256, then commits the lock. Every later episode verifies the font bytes against it.
# Stdlib Python only (no packages installed); fails without writing anything if any file can't be pinned.
name: pin-fonts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin
        run: python3 -m bot.fonts pin
      - name: Commit the lock
        run: |
          git config user.name "pixelhelm-channel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/fonts.lock.json
          git commit -m "fonts: pin EB Garamond"
          git push
