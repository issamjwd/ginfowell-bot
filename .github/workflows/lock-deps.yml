# Run by hand when requirements*.txt change. Resolves every package (and its dependencies) to exact versions with
# sha256 hashes and attaches requirements.lock.txt to the run. Review it, then add it to the repo through the
# GitHub website (Add file -> Upload files). From then on the episode workflow installs with --require-hashes.
# No secrets, read-only token: this job can't change the repo or touch YouTube.
name: lock-deps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pip==24.2 pip-tools==7.4.1   # pip-tools 7.4.1 breaks on pip >= 25
      - run: |
          cat requirements.txt requirements-claude.txt > /tmp/all.in
          pip-compile --generate-hashes --allow-unsafe --no-header --output-file requirements.lock.txt /tmp/all.in
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: requirements-lock
          path: requirements.lock.txt
